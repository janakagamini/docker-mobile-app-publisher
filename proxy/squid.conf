# Squid Corporate Egress Firewall Simulation (with HTTPS Interception / SSL Bump)
http_port 3128 ssl-bump \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=4MB \
  tls-cert=/etc/squid/certs/corp-root-ca.pem

# Helper to dynamically mint leaf certificates signed by the Corporate Root CA
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 5

# Define standard SSL/Safe ports
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8080

# Deny requests to unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Load whitelisted domains from allowed-domains.txt
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

# Allow ONLY whitelisted domains, block everything else
http_access allow allowed_domains
http_access deny all

# HTTPS Interception (SSL Inspection / MITM):
# 1. Peek at the TLS ClientHello SNI in Step 1
acl step1 at_step SslBump1
ssl_bump peek step1
# 2. Bump (decrypt & re-sign with Corporate Root CA) all allowed HTTPS connections
ssl_bump bump all

# Log clearly to access.log (with SSL bump active, Squid logs the full decrypted HTTPS URLs!)
logfile_rotate 0
access_log stdio:/var/log/squid/access.log squid
cache deny all
